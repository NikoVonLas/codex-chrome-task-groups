name: Package Chrome extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  updater-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the macOS updater
        run: python3 -m unittest discover -s scripts

  package:
    needs: updater-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the connector and extension
        run: node --test extension.test.mjs lifecycle.test.mjs
      - name: Build and verify the extension ZIP
        id: archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$TAG" = "v$version"
          zip="chrome-task-groups-$version.zip"
          git archive --format=zip --output="$zip" \
            --add-file=LICENSE --add-file=NOTICE --add-file=ThirdPartyNotices.txt HEAD:extension
          unzip -tq "$zip"
          unzip -p "$zip" manifest.json | jq -e --arg version "$version" '.manifest_version == 3 and .version == $version'
          echo "file=$zip" >> "$GITHUB_OUTPUT"
      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.archive.outputs.file }}
        run: gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
